name: Deploy catalog to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "scripts/build_pages_site.py"
      - "scripts/validate_lisp_machine_coverage.py"
      - "scripts/validate_larsbrinkhoff_preservation.py"
      - "scripts/validate_gunkies_coverage.py"
      - "inventory/lisp-machine-os-coverage.json"
      - "inventory/preservation/**"
      - "inventory/gunkies/**"
      - "site/**"
      - "systems/**/system.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build catalog data
        run: python scripts/build_pages_site.py
      - name: Validate catalog coverage
        run: |
          python scripts/validate_lisp_machine_coverage.py
          python scripts/validate_larsbrinkhoff_preservation.py
          python scripts/validate_gunkies_coverage.py
          python scripts/validate_text_editor_coverage.py
          python scripts/validate_pages_site.py
          node --check site/app.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
